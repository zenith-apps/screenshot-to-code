name: CI Sanity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose config check
        run: |
          set -euo pipefail
          mapfile -t compose_files < <(find . -type f \( -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "docker-compose.*.yml" -o -name "docker-compose.*.yaml" \))
          if [ ${#compose_files[@]} -eq 0 ]; then
            echo "No compose files found"
            exit 0
          fi

          mkdir -p "${GITHUB_WORKSPACE}/.secrets/indexing-ops"
          : > "${GITHUB_WORKSPACE}/.secrets/indexing-ops/.env"
          export PROJECTS_ROOT="${GITHUB_WORKSPACE}"

          for f in "${compose_files[@]}"; do
            d="$(dirname "$f")"
            if [ ! -f "$d/.env" ]; then
              if [ -f "$d/.env.example" ]; then
                cp "$d/.env.example" "$d/.env"
              else
                : > "$d/.env"
              fi
            fi
            echo "Checking $f"
            docker compose -f "$f" config > /dev/null
          done

      - name: Setup Node.js
        if: ${{ hashFiles("package.json") != "" || hashFiles("*.js") != "" }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript lint/test
        if: ${{ hashFiles("package.json") != "" }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run lint --if-present
          npm test --if-present

      - name: JavaScript syntax check (standalone)
        if: ${{ hashFiles("package.json") == "" && hashFiles("*.js") != "" }}
        run: |
          set -euo pipefail
          mapfile -t js_files < <(find . -maxdepth 1 -type f -name "*.js")
          for f in "${js_files[@]}"; do
            echo "Checking syntax: $f"
            node --check "$f"
          done

      - name: Setup Python
        if: ${{ hashFiles("pyproject.toml") != "" || hashFiles("requirements.txt") != "" || hashFiles("requirements-web.txt") != "" }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python sanity checks
        if: ${{ hashFiles("pyproject.toml") != "" || hashFiles("requirements.txt") != "" || hashFiles("requirements-web.txt") != "" }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-web.txt ]; then
            pip install -r requirements-web.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e . || pip install .
          fi
          pip install pytest
          python -m compileall -q .
          if [ -d tests ] || compgen -G "test_*.py" > /dev/null || compgen -G "*_test.py" > /dev/null; then
            pytest -q
          else
            echo "No Python tests found. compileall check only."
          fi

