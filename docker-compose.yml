version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
    - .env
    ports:
    - 127.0.0.1:${BACKEND_PORT:-7001}:${BACKEND_PORT:-7001}
    command: poetry run uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-7001}
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
    - 127.0.0.1:5173:5173
    restart: unless-stopped
